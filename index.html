<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <title>Skills test | Sweet Treats </title>
</head>
<body>
    <h1>Sweet Treats Dessert Ordering</h1>

    <h3>Menu:</h3>

    <input type="checkbox" id="cake" value="85">
    Chocolate Cake - ₱85.00<br>

    <input type="checkbox" id="donut" value="45">
    Glazed Donut - ₱45.00<br>

    <input type="checkbox" id="cupcake" value="55">
    Strawberry Cupcake - ₱55.00<br>

    <input type="checkbox" id="icecream" value="65">
    Ice Cream - ₱65.00<br>

    <input type="checkbox" id="brownie" value="70">
    Fudge Brownie - ₱70.00<br><br>

    <button py-click="make_receipt">
        Create Receipt
    </button>

    <h3>Receipt:</h3>

    <div id="receipt_subtotal"></div><br>
    <div id="receipt_vat"></div><br>
    <div id="receipt_total"></div><br>

    <py-script src="main.py"></py-script>
    
</body>
</html>
